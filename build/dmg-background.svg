<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="360" viewBox="0 0 600 360">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F7FB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#159DFF"/>
      <stop offset="1" stop-color="#2D6BDE"/>
    </linearGradient>
    <radialGradient id="glow" cx="100%" cy="0" r="72%">
      <stop offset="0" stop-color="#DCEEFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F7FAFD" stop-opacity="0"/>
    </radialGradient>
    <filter id="motifGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#surface)"/>
  <rect width="600" height="360" fill="url(#glow)"/>
  <rect width="600" height="4" fill="url(#accent)"/>

  <g opacity="0.38">
    <circle cx="588" cy="8" r="70" fill="none" stroke="#91C9F7" stroke-width="1"/>
    <circle cx="588" cy="8" r="48" fill="none" stroke="#91C9F7" stroke-width="1"/>
  </g>

  <image x="180" y="24" width="240" height="64" xlink:href="../assets/ak-lazer-logo-wide.png" preserveAspectRatio="xMidYMid meet"/>

  <g transform="translate(300 220)">
    <circle r="42" fill="#EAF5FF" fill-opacity="0.72" stroke="#7AB9EF" stroke-width="1" stroke-dasharray="3 7"/>
    <circle r="29" fill="none" stroke="#A7CFF2" stroke-width="1"/>
    <path d="M-48 0 H48 M0-48 V48" stroke="#9CC9EF" stroke-width="1" stroke-linecap="round"/>
    <path d="M-25-25 25 25 M25-25-25 25" stroke="#C3DDF4" stroke-width="1"/>
    <g fill="#FFFFFF" stroke="#3F99E7" stroke-width="1.5">
      <circle cx="0" cy="-42" r="3"/>
      <circle cx="42" cy="0" r="3"/>
      <circle cx="0" cy="42" r="3"/>
      <circle cx="-42" cy="0" r="3"/>
    </g>
    <g filter="url(#motifGlow)">
      <path d="M0-17 17 0 0 17-17 0Z" fill="url(#accent)"/>
      <circle r="5" fill="#FFFFFF"/>
      <circle r="2.5" fill="#1A8EF0"/>
    </g>
  </g>
</svg>
